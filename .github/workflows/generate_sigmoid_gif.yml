name: Generate sigmoid GIF

on:
  push:
    paths:
      - '.github/workflows/generate_sigmoid_gif.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 matplotlib==3.10.8 pillow==12.3.0

      - name: Generate GIF
        run: |
          cd visualizations/sigmoid
          python sigmoid_extreme_nn_explainer.py

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visualizations/sigmoid/sigmoid_extreme_nn_explainer.gif
          git diff --cached --quiet && exit 0
          git commit -m "Add generated sigmoid animation GIF"
          git push
